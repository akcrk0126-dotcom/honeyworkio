<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HONEYWORKS 🍯</title>
<link rel="preconnect" href="https://webfontworld.github.io">
<style>
@font-face{
  font-family:'Galmuri9';
  src:url('https://webfontworld.github.io/galmuri/Galmuri9.woff2') format('woff2');
  font-weight:normal; font-style:normal; font-display:swap;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{
  margin:0; padding:0; width:100%; height:100%; overflow:hidden;
  font-family:'Galmuri9','DungGeunMo',-apple-system,'Malgun Gothic',sans-serif;
  background:#FFF6E5; touch-action:none; color:#5C4326;
}
#app{position:relative; width:100vw; height:100vh; display:flex; flex-direction:column;}

/* ===== 상단 자원바 ===== */
#topbar{
  display:flex; align-items:center; gap:5px; padding:8px 5px;
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,.20) 0 10px, rgba(255,255,255,0) 10px 20px),
    linear-gradient(#FFEDC0,#FFCE6E);
  border-bottom:4px solid #E0A83E; z-index:50; flex-wrap:nowrap;
  overflow-x:auto; box-shadow:0 3px 8px rgba(180,120,30,.25);
}
.res{
  display:flex; align-items:center; gap:4px; background:#FFFBF0;
  border:2px solid #E8B858; border-radius:18px; padding:3px 8px 3px 3px;
  font-size:11px; white-space:nowrap; flex-shrink:0;
  box-shadow:0 2px 0 #D8A64A, inset 0 1px 0 #fff;
}
.res .icon{
  font-size:12px; width:20px; height:20px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; background:#FFF3D8; box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);
}
.res.labor .icon{background:#F0DFC8;}
.res.pollen .icon{background:#FFD3E4;}
.res.honey .icon{background:#FFE29B;}
.res.money .icon{background:#CDF3CD;}
.res.gems .icon{background:#DCD1FF;}
.res.tickets .icon{background:#FFD8B0;}
.res .val{font-weight:bold; min-width:16px;}
#settingsBtn{
  margin-left:auto; flex-shrink:0; background:linear-gradient(#FFB37A,#FF8F4D); color:#fff; border:2px solid #D97840;
  border-radius:12px; padding:7px 11px; font-size:16px; box-shadow:0 3px 0 #C46530; cursor:pointer;
}
#settingsBtn:active{transform:translateY(2px); box-shadow:0 1px 0 #C46530;}

/* ===== 뷰포트 & 슬라이더 ===== */
#viewport{flex:1; position:relative; overflow:hidden;}
#slider{
  position:absolute; top:0; left:0; height:100%; width:200%;
  display:flex; transition:transform .55s cubic-bezier(.65,0,.35,1);
}
.screen{
  width:50%; height:100%; position:relative; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
}
#hiveScreen{
  background:
    radial-gradient(circle at 50% -8%, rgba(255,255,255,.6), transparent 55%),
    radial-gradient(circle at 50% 22%, #FFF6DC, #FFDE95 78%);
}
#fieldScreen{
  position:relative;
  background:radial-gradient(circle at 50% -8%, rgba(255,255,255,.55), transparent 50%),
    radial-gradient(circle at 50% 18%, #F3FFE8, #B7E89C 85%);
  transition:background 1s ease;
}
#fieldScreen::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:13%;
  background:linear-gradient(#8FCB6E,#6FAE4E); border-top:3px solid #5C9440; z-index:1;
}
.screenTitle{margin:8px 0 2px; font-size:15px; font-weight:bold; color:#8A5A22; text-shadow:1px 1px 0 #fff8; z-index:2;}

/* 화살표 버튼 */
.navArrow{
  position:absolute; top:50%; transform:translateY(-50%);
  width:40px; height:68px; background:linear-gradient(#FFFEF8,#FFF1D2); border:3px solid #E8B858;
  border-radius:16px; font-size:20px; display:flex; align-items:center; justify-content:center;
  color:#B87A2A; z-index:30; cursor:pointer; font-weight:bold;
  box-shadow:0 4px 0 #D8A64A, 0 6px 10px rgba(140,90,20,.22);
}
.navArrow:active{transform:translateY(calc(-50% + 3px)); box-shadow:0 1px 0 #D8A64A;}
#toFieldArrow{right:6px;}
#toHiveArrow{left:6px;}

/* ===== 벌집 그리드 (지그재그 허니콤, 3D 왁스 질감) ===== */
#hiveGrid{
  display:flex; flex-direction:column; align-items:center; gap:0;
  padding:14px 10px 6px; width:100%; overflow-y:auto; flex:1; z-index:2; position:relative;
  background-image:radial-gradient(rgba(232,184,88,.3) 1.5px, transparent 1.5px);
  background-size:16px 16px;
}
.hiveRow{display:flex; gap:8px; margin-top:-15px;}
.hiveRow:first-child{margin-top:0;}
.hiveRowShift{margin-left:39px;}
.hexSlot{
  position:relative; width:70px; height:80px; flex-shrink:0;
  background:radial-gradient(circle at 32% 24%, #FFF6D4 0%, #FFC55C 55%, #E8961E 85%, #C97D14 100%);
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  filter:drop-shadow(0 4px 0 #C97D14) drop-shadow(0 6px 5px rgba(120,70,10,.28));
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; transition:transform .15s;
}
.hexSlot.empty{
  background:radial-gradient(circle at 32% 24%, #FFFAEC 0%, #FFE3A0 70%, #F0C878 100%);
  filter:drop-shadow(0 4px 0 #E0C088) drop-shadow(0 5px 4px rgba(120,70,10,.14));
  opacity:.85;
}
.hexSlot.empty .plus{font-size:22px; color:#D9A85A; font-weight:bold;}
.hexSlot .beeEmoji{font-size:22px; transition:transform .3s; filter:drop-shadow(0 2px 1px rgba(0,0,0,.18));}
.hexSlot .beeGradeTag{font-size:7px; font-weight:bold; color:#5C3213; background:rgba(255,255,255,.65); border-radius:5px; padding:0 3px;}
.hexSlot .phaseTag{
  position:absolute; bottom:-5px; font-size:6.5px; background:#fff; border:1px solid #E8B858;
  border-radius:6px; padding:1px 5px; color:#B87A2A; box-shadow:0 1px 0 #D8A64A;
}
.hexSlot.bobbing .beeEmoji{animation:bob 1.6s ease-in-out infinite;}
.hexSlot.away{opacity:.55;}
.hexSlot.away .beeEmoji{filter:grayscale(.5);}
.hexSlot:active{transform:scale(.93);}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-4px) rotate(-4deg);}}

#workBtnWrap{padding:8px; width:100%; display:flex; justify-content:center; z-index:2; position:relative;}
#workBtn{
  background:linear-gradient(#FFCB84,#FF9D3E); border:3px solid #D97840; color:#5C3213; font-weight:bold;
  border-radius:16px; padding:10px 26px; font-size:12px; cursor:pointer;
  box-shadow:0 4px 0 #C46530, inset 0 1px 0 rgba(255,255,255,.65);
}
#workBtn:active{transform:translateY(3px); box-shadow:0 1px 0 #C46530;}

/* ===== 꽃밭 ===== */
#flowerField{position:relative; width:100%; flex:1; overflow:hidden; z-index:2;}
.flower{
  position:absolute; font-size:28px; transform:translate(-50%,-50%);
  animation:sway 2.4s ease-in-out infinite; filter:drop-shadow(0 3px 2px rgba(30,60,10,.2));
}
@keyframes sway{0%,100%{transform:translate(-50%,-50%) rotate(-6deg);}50%{transform:translate(-50%,-50%) rotate(6deg);}}
.flyingBee{
  position:absolute; font-size:22px; z-index:20; pointer-events:none;
  transition:left 1.1s ease-in-out, top 1.1s ease-in-out, opacity .4s;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
}
.floatText{
  position:absolute; font-size:10.5px; font-weight:bold; z-index:40; pointer-events:none;
  animation:floatUp 1.1s ease-out forwards;
}
@keyframes floatUp{0%{opacity:1; transform:translate(-50%,0);}100%{opacity:0; transform:translate(-50%,-38px);}}
.sparkle{position:absolute; font-size:14px; pointer-events:none; animation:sparkle .8s ease-out forwards;}
@keyframes sparkle{0%{opacity:1; transform:translate(-50%,-50%) scale(.4);}100%{opacity:0; transform:translate(-50%,-90%) scale(1.3);}}

/* ===== 화면 좌표 플로팅 텍스트 ===== */
.floatTextPage{
  position:fixed; font-size:13px; font-weight:bold; z-index:300; pointer-events:none;
  transform:translate(-50%,-50%); animation:floatUpPage 1s ease-out forwards;
  text-shadow:1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
}
@keyframes floatUpPage{
  0%{opacity:1; transform:translate(-50%,-50%) scale(1);}
  20%{transform:translate(-50%,-65%) scale(1.15);}
  100%{opacity:0; transform:translate(-50%,-130%) scale(1);}
}
.clickBeeSprite{
  position:absolute; font-size:22px; z-index:25; pointer-events:none;
  transition:left .75s ease-in-out, top .75s ease-in-out; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
}

/* ===== 황금 벌 ===== */
.goldenBee{
  position:absolute; font-size:28px; z-index:70; cursor:pointer;
  animation:goldenPulse .6s ease-in-out infinite alternate, goldenDrift 2.2s ease-in-out infinite;
  filter:drop-shadow(0 0 6px #FFD700) drop-shadow(0 0 12px #FFE97A);
}
@keyframes goldenPulse{0%{transform:scale(1);}100%{transform:scale(1.18);}}
@keyframes goldenDrift{0%,100%{margin-top:0;}50%{margin-top:-8px;}}

/* ===== 말벌 습격 ===== */
.waspSprite{position:absolute; z-index:75; cursor:pointer; text-align:center; animation:waspFly 1s ease-in-out infinite alternate;}
.waspSprite .waspEmoji{font-size:34px; display:block; filter:hue-rotate(300deg) saturate(3) drop-shadow(0 0 6px rgba(200,20,20,.6));}
.waspSprite.hit .waspEmoji{animation:waspShake .15s;}
.waspSprite .waspHp{background:#C0392B; color:#fff; font-size:9px; font-weight:bold; border-radius:8px; padding:1px 6px; margin-top:2px; display:inline-block; box-shadow:0 1px 0 #8E2A1F;}
.waspSprite .waspBar{width:42px; height:4px; background:rgba(0,0,0,.15); border-radius:3px; margin:3px auto 0; overflow:hidden;}
.waspSprite .waspBarFill{height:100%; background:#E86B5C; width:100%;}
@keyframes waspFly{0%{transform:translateY(0) rotate(-4deg);}100%{transform:translateY(-6px) rotate(4deg);}}
@keyframes waspShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

/* ===== 하단 네비 ===== */
#bottomNav{display:flex; border-top:4px solid #E8B858; background:#FFF3D8; z-index:50;}
#bottomNav button{
  flex:1; padding:9px 2px; background:none; border:none; font-size:10px; color:#8A5A22;
  font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
}
#bottomNav button .bIcon{font-size:17px;}

/* ===== 모달 공통 ===== */
.modalOverlay{position:fixed; inset:0; background:rgba(90,60,20,.45); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
.modalOverlay.hidden{display:none;}
.modalBox{
  background:#FFFBF0; width:100%; max-width:480px; max-height:84vh; overflow-y:auto;
  border-radius:20px 20px 0 0; border:3px solid #E8B858; border-bottom:none; padding:14px 16px 24px;
}
.modalHead{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.modalHead h2{font-size:15px; margin:0; color:#8A5A22;}
.closeX{background:#FFE0C0; border:2px solid #E8B858; border-radius:8px; padding:4px 10px; cursor:pointer;}

.tabRow{display:flex; gap:6px; margin-bottom:10px;}
.tabBtn{
  flex:1; padding:8px 4px; border-radius:10px; border:2px solid #E8B858;
  background:#FFF3D8; font-size:11px; text-align:center; cursor:pointer; color:#8A5A22; font-family:inherit;
}
.tabBtn.active{background:#FFB25E; color:#fff; font-weight:bold;}
.tabPanel{display:none;}
.tabPanel.active{display:block;}

.sectionLabel{font-size:11px; font-weight:bold; color:#8A5A22; margin:12px 0 6px;}

.gachaCard, .boxCard{
  border:2px solid; border-radius:14px; padding:11px; margin-bottom:9px;
  display:flex; align-items:center; gap:9px; background:#fff;
  box-shadow:0 3px 8px rgba(160,110,40,.14);
}
.gachaCard .gEmoji, .boxCard .gEmoji{font-size:28px;}
.gachaCard .gInfo, .boxCard .gInfo{flex:1;}
.gachaCard .gInfo b, .boxCard .gInfo b{font-size:12.5px;}
.gachaCard .gInfo div, .boxCard .gInfo div{font-size:9.5px; color:#886544; margin-top:2px;}
.gachaBtn{
  padding:7px 10px; border-radius:10px; border:none; color:#fff; font-size:10px; font-weight:bold; cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.45); margin-left:3px;
}
.gachaBtn:active{transform:translateY(2px); box-shadow:none;}
.gachaBtn:disabled{opacity:.4;}
.btnCol{display:flex; flex-direction:column; gap:4px;}

.beeListItem{
  display:flex; align-items:center; gap:10px; border:2px solid #E8B858; border-radius:12px;
  padding:8px 10px; margin-bottom:8px; background:#fff;
}
.beeListItem .lEmoji{font-size:24px;}
.beeListItem .lInfo{flex:1; font-size:10.5px;}
.beeListItem .lInfo b{font-size:12px;}
.placeBtn{background:#8CD18C; color:#fff; border:none; border-radius:8px; padding:6px 10px; font-size:10px; cursor:pointer;}
.placeBtn:disabled{background:#ccc;}

.upgradeRow{border:2px solid #E8B858; border-radius:12px; padding:10px; margin-bottom:10px; background:#fff;}
.upgradeRow .uTitle{font-size:12px; font-weight:bold; margin-bottom:2px;}
.upgradeRow .uDesc{font-size:10px; color:#886544; margin-bottom:6px;}
.upgradeRow .uBtn{
  background:linear-gradient(#FFC97E,#FF9F42); color:#fff; border:none; border-radius:8px; padding:7px 14px; font-size:11px; cursor:pointer;
  box-shadow:0 2px 0 rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.4);
}
.upgradeRow .uBtn:disabled{background:#ccc; box-shadow:none;}
.toggleBtn{background:#B8E0C8;}
.toggleBtn.on{background:#5EBB7A;}

#placeModal .beeListItem{cursor:pointer;}

/* ===== 도감 ===== */
.dexGrid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
.dexCard{border:2px solid #E8B858; border-radius:12px; padding:10px 6px; text-align:center; background:#fff; box-shadow:0 3px 8px rgba(160,110,40,.14);}
.dexCard .dEmoji{font-size:26px;}
.dexCard .dName{font-size:10px; font-weight:bold; margin-top:4px; color:#7A4A16;}
.dexCard .dGrade{font-size:8.5px; color:#886544; margin-top:1px;}
.dexCard .dFlavor{font-size:7.5px; color:#A9906E; margin-top:3px; line-height:1.35; font-style:italic;}
.dexCard .dPassive{font-size:7.5px; color:#A97C3A; margin-top:3px; line-height:1.35; font-weight:bold;}
.dexCard.locked{background:#F2EDE2; opacity:.75;}
.dexCard.locked .dEmoji{filter:grayscale(1) brightness(.6);}
.dexCard.locked .dName{color:#A99B85;}

/* ===== 설정 ===== */
.settingRow{display:flex; align-items:center; justify-content:space-between; border:2px solid #E8B858; border-radius:12px; padding:10px 12px; margin-bottom:10px; background:#fff;}
.settingRow .sLabel{font-size:12px; font-weight:bold;}
.switchToggle{width:46px; height:26px; border-radius:14px; background:#D8D0C2; position:relative; cursor:pointer; border:2px solid #B8A888; flex-shrink:0;}
.switchToggle .knob{position:absolute; top:1px; left:1px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.3); transition:left .2s;}
.switchToggle.on{background:#5EBB7A; border-color:#3F9B5C;}
.switchToggle.on .knob{left:23px;}

#toast{
  position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
  background:#5C3213; color:#fff; padding:8px 16px; border-radius:20px; font-size:11px;
  z-index:200; opacity:0; transition:opacity .3s; pointer-events:none; max-width:88%; text-align:center;
}
#toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">

  <!-- 상단 자원바 -->
  <div id="topbar">
    <div class="res labor"><span class="icon">💪</span><span class="val" id="rLabor">0</span></div>
    <div class="res pollen"><span class="icon">🌸</span><span class="val" id="rPollen">0</span></div>
    <div class="res honey"><span class="icon">🍯</span><span class="val" id="rHoney">0</span></div>
    <div class="res money"><span class="icon">💰</span><span class="val" id="rMoney">0</span></div>
    <div class="res gems"><span class="icon">💎</span><span class="val" id="rGems">0</span></div>
    <div class="res tickets"><span class="icon">🎫</span><span class="val" id="rTickets">0</span></div>
    <button id="settingsBtn">🔧</button>
  </div>

  <!-- 슬라이드 뷰포트 -->
  <div id="viewport">
    <div id="slider">
      <div class="screen" id="hiveScreen">
        <div class="screenTitle">🐝 벌집</div>
        <div id="hiveGrid"></div>
        <div id="workBtnWrap"><button id="workBtn">✊ 일하기 (+노동력)</button></div>
        <div class="navArrow" id="toFieldArrow">▶</div>
      </div>
      <div class="screen" id="fieldScreen">
        <div class="screenTitle" id="fieldTitle">🌼 꽃밭</div>
        <div id="flowerField"></div>
        <div class="navArrow" id="toHiveArrow">◀</div>
      </div>
    </div>
  </div>

  <!-- 하단 네비 -->
  <div id="bottomNav">
    <button id="navShop"><span class="bIcon">🎁</span>뽑기</button>
    <button id="navBees"><span class="bIcon">🐝</span>보유벌</button>
    <button id="navDex"><span class="bIcon">📖</span>도감</button>
    <button id="navUpgrade"><span class="bIcon">⚙️</span>업그레이드</button>
  </div>

  <!-- 뽑기(박스가챠+인벤토리) 모달 -->
  <div class="modalOverlay hidden" id="shopModal">
    <div class="modalBox">
      <div class="modalHead"><h2>🎁 뽑기</h2><span class="closeX" data-close="shopModal">✕</span></div>
      <div class="tabRow">
        <div class="tabBtn active" id="tabBoxGacha">🎰 상자 가챠</div>
        <div class="tabBtn" id="tabInv">📦 인벤토리</div>
      </div>
      <div class="tabPanel active" id="panelBoxGacha">
        <div class="upgradeRow" style="text-align:center;">
          <div class="uTitle">🎫 보유 티켓: <span id="ticketCountLabel">0</span>개</div>
          <div class="uDesc">티켓은 벌이 채집을 마치고 돌아올 때 2% 확률로 획득, 꿀 판매 누적 마일스톤 달성, 또는 보석으로 구매할 수 있어요.</div>
          <button class="uBtn" id="buyTicketBtn">💎10 → 🎫1 구매</button>
        </div>
        <div id="boxGachaList"></div>
      </div>
      <div class="tabPanel" id="panelInv">
        <div class="sectionLabel">📦 상자 (B ~ X 등급)</div>
        <div id="boxInvList"></div>
        <div class="sectionLabel">🎁 벌 가챠 상자 (Normal ~ GOD)</div>
        <div id="gachaBoxInvList"></div>
      </div>
    </div>
  </div>

  <!-- 보유벌 모달 -->
  <div class="modalOverlay hidden" id="beesModal">
    <div class="modalBox">
      <div class="modalHead"><h2>🐝 보유한 벌</h2><span class="closeX" data-close="beesModal">✕</span></div>
      <div id="beesList"></div>
    </div>
  </div>

  <!-- 도감 모달 -->
  <div class="modalOverlay hidden" id="dexModal">
    <div class="modalBox">
      <div class="modalHead"><h2>📖 벌 도감 (F ~ Y)</h2><span class="closeX" data-close="dexModal">✕</span></div>
      <div class="dexGrid" id="dexGrid"></div>
    </div>
  </div>

  <!-- 배치할 칸 선택 모달 -->
  <div class="modalOverlay hidden" id="placeModal">
    <div class="modalBox">
      <div class="modalHead"><h2>🐝 벌 배치하기</h2><span class="closeX" data-close="placeModal">✕</span></div>
      <div id="placeList"></div>
    </div>
  </div>

  <!-- 업그레이드 모달 -->
  <div class="modalOverlay hidden" id="menuModal">
    <div class="modalBox">
      <div class="modalHead"><h2>⚙️ 업그레이드</h2><span class="closeX" data-close="menuModal">✕</span></div>
      <div id="upgradeList"></div>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div class="modalOverlay hidden" id="settingsModal">
    <div class="modalBox">
      <div class="modalHead"><h2>🔧 설정</h2><span class="closeX" data-close="settingsModal">✕</span></div>
      <div id="settingsList"></div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* ============================================================
   0. 전역 데이터 / 상태 선언
   (참조 오류 방지를 위해 모든 전역 변수와 데이터 배열을 최상단에 선언)

function fmtNum(n){
  n = Math.floor(n);
  if(n >= 1000000000) return (n/1000000000).toFixed(2)+'B';
  if(n >= 1000000) return (n/1000000).toFixed(2)+'M';
  if(n >= 10000) return (n/1000).toFixed(1)+'K';
  return n.toLocaleString('ko-KR');
}

// 가중치 테이블에서 랜덤 하나 선택 (table: [{id, w}, ...])
function weightedPick(table){
  var total = 0;
  for(var i=0;i<table.length;i++){ total += table[i].w; }
  var r = Math.random() * total;
  for(var j=0;j<table.length;j++){
    r -= table[j].w;
    if(r <= 0) return table[j].id;
  }
  return table[table.length-1].id;
}

function findOwnedBee(uid){
  for(var i=0;i<state.ownedBees.length;i++){
    if(state.ownedBees[i].uid === uid) return state.ownedBees[i];
  }
  return null;
}

function bestHoneyMult(){
  var best = 1;
  for(var i=0;i<state.placedBees.length;i++){
    var uid = state.placedBees[i];
    if(!uid) continue;
    var bee = findOwnedBee(uid);
    if(!bee) continue;
    var g = getGrade(bee.gradeId);
    if(g.honeyMult > best) best = g.honeyMult;
  }
  return best;
}

/* ---- 사운드 엔진 (Web Audio API) ---- */
function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ audioCtx = null; }
  }
  return audioCtx;
}
function playTone(freq, duration, type, delay, vol){
  if(!state.soundOn) return;
  var ctx = getAudioCtx();
  if(!ctx) return;
  var t0 = ctx.currentTime + (delay||0);
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime((vol!=null?vol:0.12), t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration);
}

function loadGame(){

    if(!raw) return;
    var data = JSON.parse(raw);
    if(!data) return;
    state.labor = data.labor || 0;
    state.pollen = data.pollen || 0;
    state.honey = data.honey || 0;
    state.money = (typeof data.money === 'number') ? data.money : 50;

    state.tickets = (typeof data.tickets === 'number') ? data.tickets : 2;
    state.hiveCapacity = data.hiveCapacity || 4;
    state.placedBees = data.placedBees || new Array(state.hiveCapacity).fill(null);
    state.ownedBees = data.ownedBees || [];
    state.fieldLevel = data.fieldLevel || 1;
    state.refineLevel = data.refineLevel || 1;
    state.autoSell = !!data.autoSell;
    state.discoveredBees = data.discoveredBees || [];
    state.soundOn = (typeof data.soundOn === 'boolean') ? data.soundOn : true;
    state.boxInventory = data.boxInventory || { B:0, A:0, S:0, SS:0, SSS:0, X:0 };
    state.gachaBoxInventory = data.gachaBoxInventory || { normal:0, epic:0, super:0, ultra:0, infinity:0, god:0 };
    state.totalHoneySold = data.totalHoneySold || 0;
    state.milestonesClaimed = data.milestonesClaimed || [];

/* ============================================================
   5. 벌 채집 사이클 (이동 → 채집 → 귀환 → 정제, 패시브 반영)
   ============================================================ */
function startBeeCycle(slotIndex){
  if(activeCycles[slotIndex]) return;
  var uid = state.placedBees[slotIndex];
  if(!uid) return;
  var bee = findOwnedBee(uid);
  if(!bee) return;
  var grade = getGrade(bee.gradeId);

  var speedMult = 1;
  if(grade.passiveType === 'speed'){
    speedMult = 1 - (grade.passiveValue/100);
  }
  var globalSpeedBonus = computeGlobalSpeedBonusPercent();
  if(globalSpeedBonus > 0){
    speedMult = speedMult * (1 - globalSpeedBonus/100);
  }
  if(speedMult < 0.12) speedMult = 0.12;
  var t1 = Math.round(CYCLE.toField*speedMult);
  var t2 = Math.round(CYCLE.gather*speedMult);
  var t3 = Math.round(CYCLE.toHive*speedMult);

  activeCycles[slotIndex] = { phase:'toField' };
  renderHiveGrid();

  var beeSprite = document.createElement('div');
  beeSprite.className = 'flyingBee';
  beeSprite.textContent = bee.emoji;
  beeSprite.style.left = '2%';
  beeSprite.style.top = '85%';
  beeSprite.style.opacity = '1';
  el.flowerField.appendChild(beeSprite);

  var targetFlower = flowerPositions.length
    ? flowerPositions[Math.floor(Math.random()*flowerPositions.length)]
    : {x:50,y:50};

  requestAnimationFrame(function(){
    beeSprite.style.left = targetFlower.x + '%';
    beeSprite.style.top = targetFlower.y + '%';
  });

  setTimeout(function(){
    activeCycles[slotIndex].phase = 'gather';
    renderHiveGrid();
    spawnSparkle(targetFlower.x, targetFlower.y);

    setTimeout(function(){
      var fInfo = getFieldInfo();
      var auraBonus = computeAuraBonusPercent();
      var yieldBonus = (grade.passiveType === 'yield') ? grade.passiveValue : 0;
      var base = grade.baseYield * fInfo.mult;
      var gained = Math.round(base * (1 + auraBonus/100) * (1 + yieldBonus/100));
      spawnFloatText(targetFlower.x, targetFlower.y, '+'+gained+' 🌸');

      // 특수 꿀 드랍 패시브 (화염/번개/무지개/우주/신화의 꿀)
      if(grade.passiveType === 'specialHoney'){
        var honeyChance = grade.passiveValue + computeSpecialHoneyBoostPercent();
        if(Math.random()*100 < honeyChance){
          var bonusMoney = Math.max(10, Math.round(grade.honeyMult * 2));
          state.money += bonusMoney;
          spawnFloatText(targetFlower.x, targetFlower.y-8, grade.specialHoneyEmoji+' '+grade.specialHoneyName+' +$'+fmtNum(bonusMoney));
          playCoinSound();
        }
      }

      // 블랙홀 흡수 패시브 - 다른 벌들의 생산량 일부를 추가로 흡수
      if(grade.passiveType === 'burst'){
        var othersYield = 0;
        for(var oi=0;oi<state.placedBees.length;oi++){
          if(oi === slotIndex) continue;
          var ouid = state.placedBees[oi]; if(!ouid) continue;
          var obee = findOwnedBee(ouid); if(!obee) continue;
          var og = getGrade(obee.gradeId);
          othersYield += og.baseYield * fInfo.mult;
        }
        var burstGain = Math.round(othersYield * (grade.passiveValue/100));
        if(burstGain > 0){
          gained += burstGain;
          spawnFloatText(targetFlower.x-6, targetFlower.y, '🕳️ +'+burstGain);
        }
      }

      // 박스가챠 티켓 2% 드랍
      var gotTicket = Math.random() < 0.02;
      if(gotTicket){
        state.tickets += 1;
        spawnFloatText(targetFlower.x+6, targetFlower.y, '+1 🎫');
      }

      activeCycles[slotIndex].phase = 'toHive';
      renderHiveGrid();
      beeSprite.style.left = '2%';
      beeSprite.style.top = '85%';
      beeSprite.style.opacity = '0.3';

      setTimeout(function(){
        state.pollen += gained;
        if(beeSprite.parentNode) beeSprite.parentNode.removeChild(beeSprite);
        delete activeCycles[slotIndex];
        renderHiveGrid();
        renderResources();
        if(gotTicket) saveGame();
        if(state.placedBees[slotIndex] === uid){
          startBeeCycle(slotIndex);
        }
      }, t3);

    }, t2);

  }, t1);
}

function ensureAllBeesWorking(){
  for(var i=0;i<state.placedBees.length;i++){
    if(state.placedBees[i] && !activeCycles[i]){
      startBeeCycle(i);
    }
  }
}

/* ============================================================
   6. 정제 & 판매 & 마일스톤 틱
   ============================================================ */
function gameTick(){
  var now = Date.now();
  var dt = (now - state.lastTick) / 1000;
  if(dt > 2) dt = 2;
  state.lastTick = now;

  var refineRate = 3 * state.refineLevel + computeRefineBonus();
  var refined = Math.min(state.pollen, refineRate * dt);
  if(refined > 0){
    state.pollen -= refined;
    state.honey += refined;
  }

  if(state.autoSell && state.honey > 0){
    var sellAmt = Math.min(state.honey, 5 * dt);
    if(sellAmt > 0){
      state.honey -= sellAmt;
      var earn = sellAmt * honeyPrice();
      state.money += earn;
      registerHoneySale(earn);
    }
  }

  renderResources();
}

function registerHoneySale(amount){
  state.totalHoneySold += amount;
  for(var i=0;i<TICKET_MILESTONES.length;i++){
    var m = TICKET_MILESTONES[i];
    if(state.totalHoneySold >= m.th && state.milestonesClaimed.indexOf(i) === -1){
      state.milestonesClaimed.push(i);
      state.tickets += m.reward;
      showToast('🏆 누적 판매 $'+fmtNum(m.th)+' 달성! 티켓 +'+m.reward+'🎫');
      playTicketSound();
    }
  }
}

function spawnWasp(){
  if(waspEl || !el.hiveScreen) return;
  var x = 15 + Math.random()*60;
  var y = 18 + Math.random()*50;
  var w = document.createElement('div');
  w.className = 'waspSprite';
  w.style.left = x+'%';
  w.style.top = y+'%';
  w.innerHTML =
    '<span class="waspEmoji">🐝</span>'+
    '<div class="waspHp">5</div>'+
    '<div class="waspBar"><div class="waspBarFill"></div></div>';
  el.hiveScreen.appendChild(w);
  waspEl = w;
  waspState = { clicks:0, needed:5 };
  playWaspAlarm();
  showToast('⚠️ 말벌이 벌집에 침입했어요! 5번 연속 클릭으로 퇴치하세요!');

  var duration = 8000;
  var startTime = Date.now();
  var barFill = w.querySelector('.waspBarFill');
  var barInterval = setInterval(function(){
    var elapsed = Date.now() - startTime;
    var pct = Math.max(0, 100 - (elapsed/duration*100));
    if(barFill) barFill.style.width = pct + '%';
    if(elapsed >= duration) clearInterval(barInterval);
  }, 100);

  w.onclick = function(e){
    e.stopPropagation();
    if(!waspState) return;
    waspState.clicks++;
    playHitSound();
    w.classList.add('hit');
    setTimeout(function(){ if(w) w.classList.remove('hit'); }, 150);
    var hpEl = w.querySelector('.waspHp');
    if(hpEl) hpEl.textContent = Math.max(0, waspState.needed - waspState.clicks);
    spawnFloatTextPage(e.clientX, e.clientY, 'HIT!', '#C0392B');
    if(waspState.clicks >= waspState.needed){
      clearInterval(barInterval);
      defeatWasp();
    }
  };

  waspStealTimer = setTimeout(function(){
    clearInterval(barInterval);
    stealHoney();
  }, duration);
}
function defeatWasp(){
  if(waspStealTimer){ clearTimeout(waspStealTimer); waspStealTimer = null; }
  showToast('🎉 말벌을 퇴치했어요! 꿀을 지켜냈어요.');
  playGachaSound();
  removeWasp();
}
function stealHoney(){
  var amount = Math.min(state.honey, Math.max(10, Math.floor(state.honey*0.3)));
  state.honey -= amount;
  renderResources();
  showToast('🐝💦 말벌이 꿀 '+fmtNum(amount)+'개를 훔쳐 달아났어요!');
  saveGame();
  removeWasp();
}
function removeWasp(){
  if(waspEl){
    if(waspEl.parentNode) waspEl.parentNode.removeChild(waspEl);
    waspEl = null;
  }
  waspState = null;
}

function pullBoxGacha(count, evt){
  if(state.tickets < count){ showToast('🎫 티켓이 부족해요!'); return; }

  var results = {};
  for(var i=0;i<count;i++){
    var gradeId = weightedPick(TICKET_PULL_TABLE);
    state.boxInventory[gradeId] = (state.boxInventory[gradeId]||0) + 1;
    results[gradeId] = (results[gradeId]||0) + 1;
  }
  playTicketSound();
  var summary = Object.keys(results).map(function(k){ return '['+k+']x'+results[k]; }).join(' ');
  showToast('🎁 박스 획득! ' + summary);
  if(evt) spawnFloatTextPage(evt.clientX, evt.clientY, count>1 ? (count+'개 뽑기!') : '🎁 획득!', '#FF7A3D');
  renderResources();
  renderBoxGachaList();
  saveGame();

function openBoxGrade(gradeId, count, evt){
  var have = state.boxInventory[gradeId] || 0;
  if(have < count) return;
  var bg = getBoxGrade(gradeId);
  var results = {};
  for(var i=0;i<count;i++){
    var boxId = weightedPick(bg.dropTable);
    state.gachaBoxInventory[boxId] = (state.gachaBoxInventory[boxId]||0) + 1;
    results[boxId] = (results[boxId]||0) + 1;
  }
  state.boxInventory[gradeId] -= count;
  playGachaSound();
  var summary = Object.keys(results).map(function(k){ return getGachaBox(k).label+'x'+results[k]; }).join(' ');
  showToast('📦 ['+bg.label+'] 박스 개봉! → ' + summary);
  if(evt) spawnFloatTextPage(evt.clientX, evt.clientY, summary, bg.accent);
  renderInventoryLists();
  renderResources();
  saveGame();
}

// 2단계 벌가챠상자(Normal~GOD) 개봉 → 3단계 벌(F~Y) 획득
function openGachaBox(boxId, count, evt){
  var have = state.gachaBoxInventory[boxId] || 0;
  if(have < count) return;
  var box = getGachaBox(boxId);
  var gradeCounts = {};
  var newDexCount = 0;
  var lastBee = null;

  for(var i=0;i<count;i++){
    var gradeId = weightedPick(box.dropTable);
    var grade = getGrade(gradeId);
    var poolIdx = Math.floor(Math.random()*grade.pool.length);
    var template = grade.pool[poolIdx];
    var newBee = { uid:genUid(), gradeId:gradeId, name:template.name, emoji:template.emoji };
    state.ownedBees.push(newBee);
    lastBee = newBee;
    gradeCounts[gradeId] = (gradeCounts[gradeId]||0) + 1;

    var dexKey = gradeId + '_' + poolIdx;
    if(state.discoveredBees.indexOf(dexKey) === -1){
      state.discoveredBees.push(dexKey);
      state.gems += 5;
      newDexCount++;
    }

    // 빈 칸 있으면 자동 배치
    for(var s=0;s<state.placedBees.length;s++){
      if(!state.placedBees[s]){
        state.placedBees[s] = newBee.uid;
        startBeeCycle(s);
        break;
      }
    }
  }
  state.gachaBoxInventory[boxId] -= count;
  playGachaSound();

  var summary = Object.keys(gradeCounts).map(function(k){ return '['+k+']x'+gradeCounts[k]; }).join(' ');
  var msg = box.label+' 상자 개봉! ' + summary;
  if(newDexCount > 0) msg += ' · 📖신규 도감 '+newDexCount+'종 (+'+(newDexCount*5)+'💎)';
  showToast(msg);
  if(evt) spawnFloatTextPage(evt.clientX, evt.clientY, count>1 ? '다수 획득!' : (lastBee ? lastBee.emoji+' 획득!' : '획득!'), box.accent);

  renderInventoryLists();
  renderResources();
  renderHiveGrid();
  saveGame();
}

/* ============================================================
   8. 보유 벌 목록 & 배치
   ============================================================ */
function renderBeesList(){
  el.beesList.innerHTML = '';
  if(state.ownedBees.length===0){
    el.beesList.innerHTML = '<div style="font-size:11px;color:#886544;text-align:center;padding:20px;">아직 보유한 벌이 없어요. 뽑기 탭에서 상자를 모아보세요!</div>';
    return;
  }
  var sorted = state.ownedBees.slice().sort(function(a,b){ return getGrade(b.gradeId).idx - getGrade(a.gradeId).idx; });
  for(var i=0;i<sorted.length;i++){
    (function(bee){
      var grade = getGrade(bee.gradeId);
      var placedIdx = state.placedBees.indexOf(bee.uid);
      var item = document.createElement('div');
      item.className = 'beeListItem';
      item.style.borderColor = grade.accent;
      item.innerHTML =
        '<div class="lEmoji">'+bee.emoji+'</div>'+
        '<div class="lInfo"><b>'+bee.name+'</b> · ['+grade.label+']<br>생산량 '+grade.baseYield+' · '+grade.passiveDesc+'</div>';
      var btn = document.createElement('button');
      btn.className = 'placeBtn';
      if(placedIdx >= 0){
        btn.textContent = '배치됨('+(placedIdx+1)+'번)';
        btn.disabled = true;
      }else{
        btn.textContent = '배치하기';
        btn.onclick = function(){ openPlaceModalForBee(bee.uid); };
      }
      item.appendChild(btn);
      el.beesList.appendChild(item);
    })(sorted[i]);
  }
}

function openPlaceModalFor(slotIndex){
  el.placeList.innerHTML = '';
  var unplaced = state.ownedBees.filter(function(b){ return state.placedBees.indexOf(b.uid) === -1; });
  if(unplaced.length===0){
    el.placeList.innerHTML = '<div style="font-size:11px;color:#886544;text-align:center;padding:20px;">배치할 수 있는 벌이 없어요. 뽑기 탭에서 상자를 열어보세요!</div>';
  }else{
    unplaced.forEach(function(bee){
      var grade = getGrade(bee.gradeId);
      var item = document.createElement('div');
      item.className = 'beeListItem';
      item.style.borderColor = grade.accent;
      item.innerHTML =
        '<div class="lEmoji">'+bee.emoji+'</div>'+
        '<div class="lInfo"><b>'+bee.name+'</b> · ['+grade.label+']<br>생산량 '+grade.baseYield+'</div>';
      item.onclick = function(){
        state.placedBees[slotIndex] = bee.uid;
        closeModal('placeModal');
        renderHiveGrid();
        startBeeCycle(slotIndex);
        saveGame();
      };
      el.placeList.appendChild(item);
    });
  }
  openModal('placeModal');
}

function openPlaceModalForBee(beeUid){
  el.placeList.innerHTML = '';
  var emptySlots = [];
  for(var i=0;i<state.placedBees.length;i++){ if(!state.placedBees[i]) emptySlots.push(i); }
  if(emptySlots.length===0){
    el.placeList.innerHTML = '<div style="font-size:11px;color:#886544;text-align:center;padding:20px;">빈 칸이 없어요. 벌집을 확장해주세요!</div>';
  }else{
    emptySlots.forEach(function(idx){
      var item = document.createElement('div');
      item.className = 'beeListItem';
      item.innerHTML = '<div class="lEmoji">🔲</div><div class="lInfo"><b>'+(idx+1)+'번 칸</b></div>';
      item.onclick = function(){
        state.placedBees[idx] = beeUid;
        closeModal('placeModal');
        renderHiveGrid();
        renderBeesList();
        startBeeCycle(idx);
        saveGame();
      };
      el.placeList.appendChild(item);
    });
  }
  openModal('placeModal');
}

/* ============================================================
   8b. 벌 도감 (F ~ Y)
   ============================================================ */
function renderDexList(){
  var grid = document.getElementById('dexGrid');
  grid.innerHTML = '';
  for(var i=0;i<GRADES.length;i++){
    var grade = GRADES[i];
    for(var j=0;j<grade.pool.length;j++){
      (function(grade, template, poolIdx){
        var key = grade.id + '_' + poolIdx;
        var discovered = state.discoveredBees.indexOf(key) !== -1;
        var card = document.createElement('div');
        card.className = 'dexCard' + (discovered ? '' : ' locked');
        if(discovered){
          card.style.borderColor = grade.accent;
          card.innerHTML =
            '<div class="dEmoji">'+template.emoji+'</div>'+
            '<div class="dName">'+template.name+'</div>'+
            '<div class="dGrade">['+grade.label+'] 생산 '+grade.baseYield+'</div>'+
            (template.flavor ? '<div class="dFlavor">'+template.flavor+'</div>' : '')+
            '<div class="dPassive">'+grade.passiveDesc+'</div>';
        }else{
          card.innerHTML =
            '<div class="dEmoji">❔</div>'+
            '<div class="dName">???</div>'+
            '<div class="dGrade">['+grade.label+']</div>';
        }
        grid.appendChild(card);
      })(grade, grade.pool[j], j);
    }
  }
}

/* ============================================================
   9. 업그레이드
   ============================================================ */
function hiveExpandCost(){ return Math.round(80 * Math.pow(state.hiveCapacity, 1.6)); }
function refineUpgradeCost(){ return Math.round(200 * Math.pow(state.refineLevel, 1.6)); }

function renderUpgradeList(){
  el.upgradeList.innerHTML = '';

  var expCost = hiveExpandCost();
  el.upgradeList.appendChild(makeUpgradeRow(
    '🏠 벌집 확장', '현재 '+state.hiveCapacity+'칸 → '+(state.hiveCapacity+1)+'칸',
    '$'+fmtNum(expCost)+' 확장', state.money >= expCost && state.hiveCapacity < 60,
    function(){
      state.money -= expCost;
      state.hiveCapacity += 1;
      state.placedBees.push(null);
      showToast('벌집이 확장되었어요!');
      renderAll(); renderUpgradeList(); saveGame();
    }
  ));

  var fInfo = getFieldInfo();
  var nextField = FIELD_LEVELS.filter(function(f){return f.level===state.fieldLevel+1;})[0];
  if(nextField){
    el.upgradeList.appendChild(makeUpgradeRow(
      '🌷 꽃밭 업그레이드', fInfo.name+' → '+nextField.name+' (채집량 x'+nextField.mult+')',
      '$'+fmtNum(nextField.upgradeCost)+' 업그레이드', state.money >= nextField.upgradeCost,
      function(){
        state.money -= nextField.upgradeCost;
        state.fieldLevel = nextField.level;
        showToast(nextField.name+'(으)로 업그레이드!');
        renderFlowerField(); renderUpgradeList(); renderResources(); saveGame();
      }
    ));
  }else{
    el.upgradeList.appendChild(makeUpgradeRow('🌷 꽃밭 업그레이드','최고 단계('+fInfo.name+') 달성!','완료',false,function(){}));
  }

  var refCost = refineUpgradeCost();
  el.upgradeList.appendChild(makeUpgradeRow(
    '🏭 정제소 업그레이드', '정제 속도 Lv.'+state.refineLevel+' → Lv.'+(state.refineLevel+1),
    '$'+fmtNum(refCost)+' 업그레이드', state.money >= refCost,
    function(){
      state.money -= refCost;
      state.refineLevel += 1;
      showToast('정제 속도가 빨라졌어요!');
      renderResources(); renderUpgradeList(); saveGame();
    }
  ));

  var autoSellCost = 2000;
  var row = document.createElement('div');
  row.className = 'upgradeRow';
  row.innerHTML =
    '<div class="uTitle">💵 자동 판매</div>'+
    '<div class="uDesc">저장된 꿀을 자동으로 판매해요 (현재 꿀 가격: $'+honeyPrice()+' / 개)</div>';
  var abtn = document.createElement('button');
  if(state.autoSell){
    abtn.className='uBtn toggleBtn on'; abtn.textContent='ON (구매완료)'; abtn.disabled = true;
  }else{
    abtn.className='uBtn toggleBtn'; abtn.textContent='$'+fmtNum(autoSellCost)+'로 구매'; abtn.disabled = state.money < autoSellCost;
    abtn.onclick = function(){
      state.money -= autoSellCost;
      state.autoSell = true;
      showToast('자동 판매가 활성화되었어요!');
      renderUpgradeList(); renderResources(); saveGame();
    };
  }
  row.appendChild(abtn);
  el.upgradeList.appendChild(row);

  el.upgradeList.appendChild(makeUpgradeRow(
    '✊ 노동력 부스트', '노동력 10을 사용해 꽃가루 최대 30을 즉시 꿀로 정제',
    '노동력 10 사용', state.labor >= 10 && state.pollen > 0,
    function(){
      state.labor -= 10;
      var amt = Math.min(state.pollen, 30);
      state.pollen -= amt;
      state.honey += amt;
      showToast('즉시 정제 완료! +'+amt+' 🍯');
      renderResources(); renderUpgradeList(); saveGame();
    }
  ));

  el.upgradeList.appendChild(makeUpgradeRow(
    '🏪 꿀 판매하기', '보유한 꿀 '+fmtNum(state.honey)+'개를 개당 $'+honeyPrice()+'에 판매',
    '전부 판매', state.honey > 0,
    function(e){
      var earn = state.honey * honeyPrice();
      state.money += earn;
      state.honey = 0;
      registerHoneySale(earn);
      showToast('$'+fmtNum(earn)+' 판매 완료!');
      playCoinSound();
      if(e) spawnFloatTextPage(e.clientX, e.clientY, '+$'+fmtNum(earn), '#5EBB7A');
      renderResources(); renderUpgradeList(); saveGame();
    }
  ));
}

function makeUpgradeRow(title, desc, btnLabel, enabled, onClick){
  var row = document.createElement('div');
  row.className = 'upgradeRow';
  row.innerHTML = '<div class="uTitle">'+title+'</div><div class="uDesc">'+desc+'</div>';
  var btn = document.createElement('button');
  btn.className = 'uBtn';
  btn.textContent = btnLabel;
  btn.disabled = !enabled;
  btn.onclick = onClick;
  row.appendChild(btn);
  return row;
}

/* ============================================================
   9b. 설정
   ============================================================ */
function renderSettingsList(){
  var list = document.getElementById('settingsList');
  list.innerHTML = '';

  var soundRow = document.createElement('div');
  soundRow.className = 'settingRow';
  soundRow.innerHTML = '<div class="sLabel">🔊 효과음</div>';
  var toggle = document.createElement('div');
  toggle.className = 'switchToggle' + (state.soundOn ? ' on' : '');
  toggle.innerHTML = '<div class="knob"></div>';
  toggle.onclick = function(){
    state.soundOn = !state.soundOn;
    if(state.soundOn) playClickSound();
    renderSettingsList();
    saveGame();
  };
  soundRow.appendChild(toggle);
  list.appendChild(soundRow);

  var resetRow = document.createElement('div');
  resetRow.className = 'upgradeRow';
  resetRow.innerHTML = '<div class="uTitle">⚠️ 게임 초기화</div><div class="uDesc">모든 진행 상황이 삭제됩니다. 되돌릴 수 없어요.</div>';
  var rbtn = document.createElement('button');
  rbtn.className = 'uBtn'; rbtn.style.background = '#E86B5C';
  rbtn.textContent = '초기화';
  rbtn.onclick = function(){
    if(confirm('정말로 초기화할까요? 되돌릴 수 없어요!')){
      localStorage.removeItem('honeyworks_save');
      location.reload();
    }
  };
  resetRow.appendChild(rbtn);
  list.appendChild(resetRow);
}

/* ============================================================
   10. 모달 제어
   ============================================================ */
function openModal(id){ document.getElementById(id).classList.remove('hidden'); }
function closeModal(id){ document.getElementById(id).classList.add('hidden'); }

/* ============================================================
   11. 초기화
   ============================================================ */
function cacheDom(){
  el.rLabor = document.getElementById('rLabor');
  el.rPollen = document.getElementById('rPollen');
  el.rHoney = document.getElementById('rHoney');
  el.rMoney = document.getElementById('rMoney');
  el.rGems = document.getElementById('rGems');
  el.rTickets = document.getElementById('rTickets');
  el.slider = document.getElementById('slider');
  el.hiveScreen = document.getElementById('hiveScreen');
  el.hiveGrid = document.getElementById('hiveGrid');
  el.flowerField = document.getElementById('flowerField');
  el.fieldTitle = document.getElementById('fieldTitle');
  el.fieldScreen = document.getElementById('fieldScreen');
  el.beesList = document.getElementById('beesList');
  el.placeList = document.getElementById('placeList');
  el.upgradeList = document.getElementById('upgradeList');
  el.toast = document.getElementById('toast');
}

function bindEvents(){
  document.getElementById('toFieldArrow').onclick = function(){ goToScreen(1); };
  document.getElementById('toHiveArrow').onclick = function(){ goToScreen(0); };

  document.getElementById('workBtn').onclick = function(e){
    var gain = 1 + Math.floor(Math.random()*3);
    state.labor += gain;
    renderResources();
    playClickSound();
    spawnFloatTextPage(e.clientX, e.clientY, '+'+gain+' 💪', '#B08968');
  };

  document.getElementById('settingsBtn').onclick = function(){ renderSettingsList(); openModal('settingsModal'); };
  document.getElementById('navShop').onclick = function(){ switchShopTab('gacha'); renderBoxGachaList(); openModal('shopModal'); };
  document.getElementById('navBees').onclick = function(){ renderBeesList(); openModal('beesModal'); };
  document.getElementById('navDex').onclick = function(){ renderDexList(); openModal('dexModal'); };
  document.getElementById('navUpgrade').onclick = function(){ renderUpgradeList(); openModal('menuModal'); };

  document.getElementById('tabBoxGacha').onclick = function(){ switchShopTab('gacha'); };
  document.getElementById('tabInv').onclick = function(){ switchShopTab('inv'); };

  var closers = document.querySelectorAll('[data-close]');
  for(var i=0;i<closers.length;i++){
    closers[i].onclick = function(){ closeModal(this.getAttribute('data-close')); };
  }
  var overlays = document.querySelectorAll('.modalOverlay');
  for(var j=0;j<overlays.length;j++){
    overlays[j].addEventListener('click', function(e){
      if(e.target === this) this.classList.add('hidden');
    });
  }
}

function init(){
  cacheDom();
  loadGame();
  bindEvents();
  renderAll();
  renderFlowerField();
  goToScreen(0);
  ensureAllBeesWorking();

  setInterval(gameTick, 500);
  setInterval(saveGame, 5000);
  setInterval(spawnGoldenBee, 45000);
  setInterval(spawnWasp, 120000);
  window.addEventListener('beforeunload', saveGame);
}

document.addEventListener('DOMContentLoaded', init);
</script>
